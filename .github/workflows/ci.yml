# Her push ve pull request'te kaliteyi kontrol eder.
# Yayın iş akışı (github-pages.yml) bundan bağımsızdır.

name: Kalite kontrol

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Kod denetimi (ESLint)
        run: npm run lint

      - name: Tip denetimi
        run: npm run typecheck

      - name: Derleme
        run: npm run build

      - name: Tarayıcıyı kur
        run: npx playwright install --with-deps chromium

      - name: Testler (sayfalar, erişilebilirlik, form, bağlantılar)
        run: npm run test

      - name: Başarısız test çıktıları
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-raporu
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      # GitHub Pages sürümü alt dizinde yayınlanır. Düz <img src="/..."> gibi
      # yollar basePath almadığı için bu sürüm ayrıca test edilir.
      - name: Statik dışa aktarımı derle ve alt dizinde test et
        run: |
          rm -rf app/api .next out
          STATIC_EXPORT=true \
          NEXT_PUBLIC_STATIC_EXPORT=true \
          NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }} \
          npm run build

          mkdir -p /tmp/pages/${{ github.event.repository.name }}
          cp -r out/* /tmp/pages/${{ github.event.repository.name }}/
          (cd /tmp/pages && python3 -m http.server 4300 &) 
          sleep 3

          BASE_URL=http://localhost:4300 \
          BASE_PATH=/${{ github.event.repository.name }} \
          npm run test
