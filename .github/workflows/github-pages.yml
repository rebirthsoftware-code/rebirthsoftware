# Siteyi GitHub Pages üzerinde yayınlar.
#
# Kurulum (bir kez yapılır):
#   GitHub → repo → Settings → Pages → "Source" = GitHub Actions
#
# Sonrasında main dalına her push'ta site otomatik güncellenir.
# Adres: https://<kullanici>.github.io/<repo-adi>/
#
# NOT: GitHub Pages statik dosya sunar, sunucu kodu çalıştırmaz.
# Bu yüzden derleme öncesi /api klasörü çıkarılır ve teklif formu
# WhatsApp yönlendirmesine düşer. Vercel'de form tam olarak çalışır.

name: GitHub Pages

on:
  push:
    # SADECE varsayılan dal. GitHub Pages ortamı yalnızca varsayılan daldan
    # yayına izin verir; başka bir dal eklenirse aşağıdaki concurrency kuralı
    # yayını yapacak işi iptal edip başarısız olanı bırakabiliyor.
    # Varsayılan dal main yapılırsa burayı [main] olarak değiştirin.
    branches: [claude/website-review-fztdup]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Sunucu tarafı rotaları çıkar
        run: rm -rf app/api

      - name: Statik siteyi derle
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - name: Jekyll işlemesini kapat
        run: touch out/.nojekyll

      - name: Pages'i yapılandır
        uses: actions/configure-pages@v5
        # ÖNEMLİ: Bu adımın çalışması için repoda Pages'in bir kez
        # elle açılması gerekir:  Settings → Pages → Source = GitHub Actions
        # (Actions'a verilen token yeni bir Pages sitesi oluşturamıyor.)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
